services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: webstudio
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "${E2E_PGPORT:-55434}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d webstudio"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgrest:
    image: postgrest/postgrest:v12.2.12
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://user:pass@db:5432/webstudio
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: user
      PGRST_SERVER_PORT: 3000
    ports:
      - "${E2E_POSTGREST_PORT:-55433}:3000"

  builder:
    build:
      context: ../..
      dockerfile: docker/builder/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      postgrest:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 5173
      DATABASE_URL: postgresql://user:pass@db:5432/webstudio
      DIRECT_URL: postgresql://user:pass@db:5432/webstudio
      POSTGREST_URL: http://postgrest:3000
      POSTGREST_API_KEY: ""
      AUTH_SECRET: "0000"
      DEV_LOGIN: "true"
      TRPC_SERVER_API_TOKEN: local-publisher-token
      SELF_HOSTED_PUBLISHER_URL: http://publisher:4000
      PUBLISHER_HOST: localhost
    ports:
      - "5174:5173"

  publisher:
    image: ghcr.io/webstudio-community/webstudio-publisher:latest
    restart: unless-stopped
    environment:
      PORT: 4000
      PROXY_PORT: 4001
      PUBLISHER_HOST: localhost
      TRPC_SERVER_API_TOKEN: local-publisher-token
      BUILDER_INTERNAL_URL: http://builder:5173
    ports:
      - "4000:4000"
      - "4001:4001"
    volumes:
      - publisher-publish:/var/publish
      - publisher-work:/var/work

volumes:
  publisher-publish:
  publisher-work:
